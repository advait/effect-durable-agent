min_version = "2026.1.6"

[task_config]
dir = "{{config_root}}"

[tools]
node = "lts"
pnpm = "10.33.2"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.install]
description = "Install effect-durable-agent dependencies with pnpm"
hide = true
run = [
  "pnpm install --config.confirmModulesPurge=false",
  "effect-tsgo patch --no-typescript --oxlint",
  "touch node_modules/.effect-tsgo-oxlint-patched",
]
sources = ["package.json", "patches/**/*", "pnpm-lock.yaml", "pnpm-workspace.yaml"]
outputs = ["node_modules/.pnpm/lock.yaml", "node_modules/.effect-tsgo-oxlint-patched"]

[tasks.build]
description = "Build all publishable effect-durable-agent packages"
depends = ["install"]
run = "pnpm run build"
sources = [
  "examples/**/*",
  "package.json",
  "packages/**/*",
  "tsconfig.base.json",
  "tsconfig.json",
  "vite.config.ts",
]
outputs = ["packages/*/dist/**/*"]

[tasks."package:check"]
description = "Validate all packed packages in an isolated Cloudflare Worker"
depends = ["build"]
run = "node scripts/check-package.mjs"
sources = [
  "docs/**/*",
  "examples/**/*",
  "LICENSE",
  "package.json",
  "packages/**/*",
  "README.md",
  "scripts/check-package.mjs",
  "testing/package-consumer/**/*",
  "packages/effect-durable-agent/tooling/oxlint/**/*",
]

[tasks.check]
description = "Validate formatting, lint, and TypeScript types"
depends = ["install"]
run = "pnpm run check"

[tasks.lint]
description = "Alias for lint:check"
depends = ["lint:check"]

[tasks."lint:check"]
description = "Format-check and lint effect-durable-agent"
depends = ["install"]
run = ["pnpm exec vp fmt --check", "pnpm exec vp lint --deny-warnings"]
sources = [
  "examples/**/*",
  "package.json",
  "packages/**/*",
  "testing/**/*",
  "tsconfig.base.json",
  "tsconfig.json",
  "vite.config.ts",
]

[tasks."lint:fix"]
description = "Fix effect-durable-agent formatting and lint issues"
depends = ["install"]
run = ["pnpm exec vp fmt", "pnpm exec vp lint --fix"]

[tasks.typecheck]
description = "Alias for ts:check"
depends = ["ts:check"]
hide = true

[tasks."ts:check"]
description = "Typecheck effect-durable-agent"
depends = ["install"]
hide = true
run = [
  "pnpm --filter effect-durable-agent run typecheck",
  "pnpm --filter effect-durable-agent-cloudflare run typecheck",
  "pnpm --filter effect-durable-agent-celld run typecheck",
]
sources = ["examples/**/*", "package.json", "packages/**/*", "tsconfig.base.json", "tsconfig.json"]

[tasks.test]
description = "Run effect-durable-agent tests"
depends = ["install"]
run = "pnpm run test"
sources = ["examples/**/*", "package.json", "packages/**/*", "testing/**/*", "vite.config.ts"]

[tasks.ci]
description = "Run all effect-durable-agent validation"
depends = ["install"]
run = "pnpm run ci"
