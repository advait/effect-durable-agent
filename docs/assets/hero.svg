<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1400"
  height="150"
  viewBox="0 0 1400 150"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Effect Durable Agent</title>
  <desc id="description">
    EDA is a redux-inspired durable state management layer for agentic applications
  </desc>

  <defs>
    <style>
      .statement {
        fill: #4f5d75;
        font: 600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .emphasis {
        fill: #9a674f;
        font-weight: 700;
      }
    </style>
  </defs>

  <rect width="1400" height="150" rx="18" fill="#f5f5f5" />

  <text class="statement" x="700" y="75" text-anchor="middle" dominant-baseline="middle">
    EDA is a redux-inspired <tspan class="emphasis">durable state management layer</tspan> for
    agentic applications
  </text>
</svg>
