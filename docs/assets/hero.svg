<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="250"
  viewBox="0 0 1200 250"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Effect Durable Agent</title>
  <desc id="description">
    EDA is a Redux-inspired durable state-management layer for agentic applications, hosted on
    Cloudflare Durable Objects.
  </desc>

  <defs>
    <style>
      .opening {
        fill: #2d3142;
        font: 600 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .focal {
        fill: #9a674f;
        font: 700 50px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .closing {
        fill: #4f5d75;
        font: 500 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </defs>

  <rect width="1200" height="250" rx="18" fill="#f5f5f5" />

  <text class="opening" x="600" y="67" text-anchor="middle">EDA is a Redux-inspired</text>
  <text class="focal" x="600" y="137" text-anchor="middle">
    durable state-management layer
  </text>
  <text class="closing" x="600" y="199" text-anchor="middle">
    for agentic applications, hosted on Cloudflare Durable Objects.
  </text>
</svg>
