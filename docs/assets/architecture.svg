<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="680"
  viewBox="0 0 1200 680"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Effect Durable Agent architecture</title>
  <desc id="description">
    Commands and application events enter an EDA session runtime and ordered durable event log.
    Reducers derive agent and product state, a live stream updates reconnecting clients, and durable
    sinks deliver ordered side effects. The same history supports recovery, replay, tests, and model
    context. One Cloudflare Durable Object hosts each session.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#68737d" />
    </marker>
    <style>
      .title {
        fill: #263238;
        font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .subtitle {
        fill: #56616b;
        font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card-title {
        fill: #263238;
        font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card-copy {
        fill: #56616b;
        font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .inverse-title {
        fill: #ffffff;
        font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .inverse-copy {
        fill: #dfe4e8;
        font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .arrow {
        fill: none;
        stroke: #68737d;
        stroke-width: 2.5;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect width="1200" height="680" rx="18" fill="#f7f7f5" />
  <text class="title" x="40" y="44">One durable history powers the whole application</text>
  <text class="subtitle" x="40" y="70">State, live clients, recovery, and side effects share the same source of truth.</text>

  <rect x="365" y="98" width="470" height="68" rx="12" fill="#fff9cc" stroke="#b59f00" />
  <text class="card-title" x="600" y="126" text-anchor="middle">Commands + application events</text>
  <text class="card-copy" x="600" y="149" text-anchor="middle">User intent and product facts enter together</text>

  <path class="arrow" d="M 600 166 V 200" />

  <rect x="365" y="202" width="470" height="78" rx="12" fill="#2b2d42" />
  <text class="inverse-title" x="600" y="234" text-anchor="middle">EDA session runtime</text>
  <text class="inverse-copy" x="600" y="258" text-anchor="middle">Effect workflows inside one Durable Object</text>

  <path class="arrow" d="M 600 280 V 314" />

  <rect x="365" y="316" width="470" height="78" rx="12" fill="#0072b2" />
  <text class="inverse-title" x="600" y="348" text-anchor="middle">Ordered durable event log</text>
  <text class="inverse-copy" x="600" y="372" text-anchor="middle">The session's authoritative history</text>

  <path class="arrow" d="M 520 394 V 428 H 204 V 458" />
  <path class="arrow" d="M 600 394 V 458" />
  <path class="arrow" d="M 680 394 V 428 H 996 V 458" />

  <rect x="44" y="460" width="320" height="92" rx="12" fill="#e3f6ef" stroke="#009e73" />
  <text class="card-title" x="204" y="493" text-anchor="middle">Pure reducers</text>
  <text class="card-copy" x="204" y="517" text-anchor="middle">Derive agent + product state</text>
  <text class="card-copy" x="204" y="537" text-anchor="middle">Replayable at any sequence</text>

  <rect x="440" y="460" width="320" height="92" rx="12" fill="#e6f4fa" stroke="#56b4e9" />
  <text class="card-title" x="600" y="493" text-anchor="middle">Live event stream</text>
  <text class="card-copy" x="600" y="517" text-anchor="middle">Snapshot + ordered catch-up</text>
  <text class="card-copy" x="600" y="537" text-anchor="middle">Reconnect every client</text>

  <rect x="836" y="460" width="320" height="92" rx="12" fill="#fff0e5" stroke="#d55e00" />
  <text class="card-title" x="996" y="493" text-anchor="middle">Durable sinks</text>
  <text class="card-copy" x="996" y="517" text-anchor="middle">Ordered, non-blocking delivery</text>
  <text class="card-copy" x="996" y="537" text-anchor="middle">Slack · database · APIs</text>

  <path class="arrow" d="M 204 552 V 586" />
  <path class="arrow" d="M 600 552 V 586" />
  <path class="arrow" d="M 996 552 V 586" />

  <rect x="44" y="588" width="320" height="58" rx="12" fill="#ffffff" stroke="#a7b0b7" />
  <text class="card-title" x="204" y="623" text-anchor="middle">Recovery · replay · tests</text>

  <rect x="440" y="588" width="320" height="58" rx="12" fill="#ffffff" stroke="#a7b0b7" />
  <text class="card-title" x="600" y="623" text-anchor="middle">Reconnecting clients</text>

  <rect x="836" y="588" width="320" height="58" rx="12" fill="#ffffff" stroke="#a7b0b7" />
  <text class="card-title" x="996" y="623" text-anchor="middle">Eventually consistent systems</text>
</svg>
