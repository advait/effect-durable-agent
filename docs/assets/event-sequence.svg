<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="650"
  viewBox="0 0 1000 650"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">An illustrative EDA event sequence</title>
  <desc id="description">
    Ten numbered events ordered from top to bottom. Neutral cards are EDA framework events and
    muted rust cards are application events. Sandbox, file, and approval events appear between
    agent tool and message events.
  </desc>

  <defs>
    <style>
      .event-name {
        fill: #2d3142;
        font: 600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .step-number {
        fill: #c8cacf;
        font: 500 40px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .badge-text {
        fill: #ffffff;
        font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.5px;
      }
      .legend {
        fill: #2d3142;
        font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .framework-card {
        fill: #ffffff;
        stroke: #bfc0c0;
      }
      .app-card {
        fill: #f2ebe7;
        stroke: #9a674f;
        stroke-width: 1.5;
      }
      .framework-badge {
        fill: #2d3142;
      }
      .app-badge {
        fill: #9a674f;
      }
    </style>
  </defs>

  <rect width="1000" height="650" rx="18" fill="#f5f5f5" />

  <g transform="translate(-40 -65)">

  <g transform="translate(40 100)">
    <rect class="framework-card" x="74" width="886" height="50" rx="12" />
    <text class="step-number" x="58" y="39" text-anchor="end">1</text>
    <rect class="framework-badge" x="96" y="13" width="52" height="24" rx="12" />
    <text class="badge-text" x="122" y="29" text-anchor="middle">EDA</text>
    <text class="event-name" x="170" y="31">CommandAdmitted</text>
  </g>
  <g transform="translate(40 158)">
    <rect class="framework-card" x="74" width="886" height="50" rx="12" />
    <text class="step-number" x="58" y="39" text-anchor="end">2</text>
    <rect class="framework-badge" x="96" y="13" width="52" height="24" rx="12" />
    <text class="badge-text" x="122" y="29" text-anchor="middle">EDA</text>
    <text class="event-name" x="170" y="31">RunStarted</text>
  </g>
  <g transform="translate(40 216)">
    <rect class="framework-card" x="74" width="886" height="50" rx="12" />
    <text class="step-number" x="58" y="39" text-anchor="end">3</text>
    <rect class="framework-badge" x="96" y="13" width="52" height="24" rx="12" />
    <text class="badge-text" x="122" y="29" text-anchor="middle">EDA</text>
    <text class="event-name" x="170" y="31">ToolCallStarted</text>
  </g>
  <g transform="translate(40 274)">
    <rect class="app-card" x="74" width="886" height="50" rx="12" />
    <text class="step-number" x="58" y="39" text-anchor="end">4</text>
    <rect class="app-badge" x="96" y="13" width="52" height="24" rx="12" />
    <text class="badge-text" x="122" y="29" text-anchor="middle">APP</text>
    <text class="event-name" x="170" y="31">SandboxStarted</text>
  </g>
  <g transform="translate(40 332)">
    <rect class="app-card" x="74" width="886" height="50" rx="12" />
    <text class="step-number" x="58" y="39" text-anchor="end">5</text>
    <rect class="app-badge" x="96" y="13" width="52" height="24" rx="12" />
    <text class="badge-text" x="122" y="29" text-anchor="middle">APP</text>
    <text class="event-name" x="170" y="31">FileRead</text>
  </g>
  <g transform="translate(40 390)">
    <rect class="app-card" x="74" width="886" height="50" rx="12" />
    <text class="step-number" x="58" y="39" text-anchor="end">6</text>
    <rect class="app-badge" x="96" y="13" width="52" height="24" rx="12" />
    <text class="badge-text" x="122" y="29" text-anchor="middle">APP</text>
    <text class="event-name" x="170" y="31">ApprovalRequested</text>
  </g>
  <g transform="translate(40 448)">
    <rect class="app-card" x="74" width="886" height="50" rx="12" />
    <text class="step-number" x="58" y="39" text-anchor="end">7</text>
    <rect class="app-badge" x="96" y="13" width="52" height="24" rx="12" />
    <text class="badge-text" x="122" y="29" text-anchor="middle">APP</text>
    <text class="event-name" x="170" y="31">ApprovalGranted</text>
  </g>
  <g transform="translate(40 506)">
    <rect class="framework-card" x="74" width="886" height="50" rx="12" />
    <text class="step-number" x="58" y="39" text-anchor="end">8</text>
    <rect class="framework-badge" x="96" y="13" width="52" height="24" rx="12" />
    <text class="badge-text" x="122" y="29" text-anchor="middle">EDA</text>
    <text class="event-name" x="170" y="31">ToolCallCompleted</text>
  </g>
  <g transform="translate(40 564)">
    <rect class="framework-card" x="74" width="886" height="50" rx="12" />
    <text class="step-number" x="58" y="39" text-anchor="end">9</text>
    <rect class="framework-badge" x="96" y="13" width="52" height="24" rx="12" />
    <text class="badge-text" x="122" y="29" text-anchor="middle">EDA</text>
    <text class="event-name" x="170" y="31">AssistantMessageCommitted</text>
  </g>
  <g transform="translate(40 622)">
    <rect class="framework-card" x="74" width="886" height="50" rx="12" />
    <text class="step-number" x="58" y="39" text-anchor="end">10</text>
    <rect class="framework-badge" x="96" y="13" width="52" height="24" rx="12" />
    <text class="badge-text" x="122" y="29" text-anchor="middle">EDA</text>
    <text class="event-name" x="170" y="31">RunCompleted</text>
  </g>
  </g>

  <rect class="framework-card" x="590" y="617" width="18" height="18" rx="5" />
  <text class="legend" x="618" y="631">EDA framework event</text>
  <rect class="app-card" x="790" y="617" width="18" height="18" rx="5" />
  <text class="legend" x="818" y="631">Application event</text>
</svg>
